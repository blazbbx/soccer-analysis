server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: anything that isn't a real file must fall back to index.html so
    # React Router can handle client-side routes on refresh (/matches/<id>,
    # /clips/<token>, etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache for hashed asset bundles — Vite fingerprints filenames.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
