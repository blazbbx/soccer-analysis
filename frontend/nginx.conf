server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers. nginx drops the server-level add_header lines in any location that has its
    # own add_header, so each location below repeats them.
    # No full CSP yet: the SPA talks to the API, Keycloak and MinIO on other ports, and MUI injects
    # inline styles. frame-ancestors 'self' stops other sites framing the app (clickjacking) but keeps
    # oidc-client's same-origin silent-renew iframe working.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Content-Security-Policy "frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # SPA: anything that isn't a real file must fall back to index.html so
    # React Router can handle client-side routes on refresh (/matches/<id>,
    # /clips/<token>, etc.).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must not be cached, or after a release browsers keep loading the old bundle names.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Long cache for hashed asset bundles — Vite fingerprints filenames.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
