version: '3.8'

services:
  # ----------------------------------------
  # PostgreSQL Database
  # ----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: football-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: football_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d keycloak_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  
  # ----------------------------------------
  # Ephemeral Postgres Setup
  # conditionally creates keycloak_db
  # ----------------------------------------
  postgres-setup:
    image: postgres:15-alpine
    container_name: football-postgres-setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password # Matches your POSTGRES_PASSWORD.
    volumes:
      - ./postgres-setup.sh:/setup.sh
    command: sh -c "/setup.sh"
  
  # ----------------------------------------
  # Keycloak (Identity Provider)
  # ----------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: football-keycloak
    command: 
      - start-dev
      - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: password
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "9080:8080"
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------
  # MinIO (Object Storage)
  # ----------------------------------------
  minio:
    image: minio/minio:latest
    container_name: football-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123 # Must be at least 8 characters
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
      MINIO_NOTIFY_WEBHOOK_ENABLE_spring: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_spring: "http://football-analysis:8080/api/webhooks/minio"

    ports:
      - "9000:9000" # API Port (Spring Boot talks to this)
      - "9001:9001" # Web Console Port (You log into this)
    volumes:
      - minio_data:/data

  # ----------------------------------------
  # The Ephemeral Setup Container
  # ----------------------------------------
  minio-setup:
    image: minio/mc:latest
    container_name: football-minio-setup
    depends_on:
      - minio
    volumes:
      # Mounts our script into the container
      - ./minio-setup.sh:/setup.sh
    entrypoint: /bin/sh
    command: -c "/setup.sh"

  # ----------------------------------------
  # RabbitMQ (Message Broker)
  # ----------------------------------------
  rabbitmq:
    # We use the "-management" tag to get the built-in Web UI
    image: rabbitmq:3-management-alpine
    container_name: football-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: password
      RABBITMQ_ERLANG_COOKIE: "secret_string"
    ports:
      - "5672:5672"   # AMQP Port (Spring Boot talks to this)
      - "15672:15672" # Web Console Port (You log into this)
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 5

  ml-worker:
    build: 
      context: ./football-python-mock # Points to the folder containing your Dockerfile
    container_name: football-ml-worker
    command: python ml_worker.py
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - MINIO_HOST=minio
    restart: always

  encoder-worker:
    build:
      context: ./football-python-mock
    container_name: football-encoder-worker
    command: python hls_encoder.py
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    environment:
      - RABBITMQ_HOST=rabbitmq
      - MINIO_HOST=minio
      #- MOCK=true # Ha lehalna az enkódolás kommentezd ki, így majd egy beégetett enkódolt videót küld fel mindig
    restart: always

  # ----------------------------------------
  # Spring Boot Backend
  # ----------------------------------------
  football-analysis:
    build:
      context: ../football-analysis
      dockerfile: Dockerfile
    container_name: football-analysis
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/football_db
      RABBITMQ_HOST: rabbitmq
      MINIO_HOST: minio
      MINIO_PUBLIC_HOST: localhost
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_PORT: 8080   # internal container port (host exposes it as 9080)
      # issuer-uri must equal the 'iss' claim Keycloak stamps in tokens.
      # Keycloak issues tokens using the URL the browser/frontend used → localhost:9080.
      KEYCLOAK_ISSUER_URI: http://localhost:9080/realms/football-realm
      # jwk-set-uri uses the internal Docker service name + internal port 8080.
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/football-realm/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started
    restart: always
# ----------------------------------------
# Persistent Volumes
# Ensures data isn't lost if you stop Docker
# ----------------------------------------
volumes:
  postgres_data:
  minio_data:
  rabbitmq_data: