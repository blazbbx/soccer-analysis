server:
  port: 8080 # The port React and MinIO will call

spring:
  # 1. PostgreSQL Connection
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/football_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${idp.keycloak.server-url}/realms/football-realm"
          jwk-set-uri: "${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs"


  # Hibernate/JPA Configuration
  jpa:
    hibernate:
      ddl-auto: update # Automatically creates/updates your DB tables based on Java classes
    show-sql: true # Prints SQL to the console
    properties:
      hibernate:
        format_sql: true

  # 2. RabbitMQ Connection
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: admin
    password: password

# 3. Custom MinIO Configuration
# We create our own namespace here, which we will read into Java later
minio:
  endpoint: http://${MINIO_HOST:localhost}:9000
  access-key: SPRING_BOOT_USER
  secret-key: SuperSecretKey123
  buckets:
    raw-videos: raw-videos
    tracking-data: tracking-data
    # clips: clips # later maybe needed

idp:
  provider: keycloak
  keycloak:
    server-url: http://${KEYCLOAK_HOST:localhost}:9080
    realm: "football-realm"
    client-id: "football-web-client"
    principal-attribute: "sub"
    admin-client:
      id: "football-admin-client"
      secret: "M4Yl0gIvqOL02OSfB6eHgkM9NNersMHH"
  route-permissions: # Itt meg tudod adni a role-okat, amik az egyes endpointokhoz kellenek
    - path: /coach_endpoint/** # ezek csak példák a használtara. itt pl. minden coach-al kezdődő endpointot csak a coach role-al rendelelkezők érik el
      roles: [coach]
    - path: /team_endpoint/**
      roles: [coach, player]
      # ami nincs itt felsorolva az publikus

react-app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:4173}