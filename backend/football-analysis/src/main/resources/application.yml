server:
  port: 8080 # The port React and MinIO will call

app:
  # Zone of the Clock bean that stamps travel and parent-invite times.
  # Deadlines are stored and shown. They do not close the Lejutás board.
  time-zone: ${APP_TIME_ZONE:Europe/Budapest}

spring:
  application:
    name: football-analysis

  # 1. PostgreSQL Connection
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/football_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          # issuer-uri must match the 'iss' claim in Keycloak tokens (always the public/host URL).
          # jwk-set-uri can point to the internal Docker service name so Spring Boot can
          # fetch the public keys even when running inside a container.
          issuer-uri: "${KEYCLOAK_ISSUER_URI:${idp.keycloak.server-url}/realms/football-realm}"
          jwk-set-uri: "${KEYCLOAK_JWK_SET_URI:${idp.keycloak.server-url}/realms/football-realm/protocol/openid-connect/certs}"


  # Hibernate/JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50
        # Event times are LocalDateTime in the club's zone; keep JDBC on the same zone as app.time-zone.
        jdbc:
          time_zone: ${APP_TIME_ZONE:Europe/Budapest}

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # 2. RabbitMQ Connection
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USERNAME:${SPRING_RABBITMQ_USERNAME:admin}}
    password: ${RABBITMQ_PASSWORD:${SPRING_RABBITMQ_PASSWORD:password}}

# 3. Custom MinIO Configuration
# We create our own namespace here, which we will read into Java later
minio:
  endpoint: http://${MINIO_HOST:localhost}:9000
  # `MINIO_PUBLIC_ENDPOINT` lets prod override the full URL (scheme + host +
  # optional port) — e.g. `https://minio.kixify.hu`. The two-var fallback
  # below is kept so dev compose stays a single host/port tweak.
  public-endpoint: ${MINIO_PUBLIC_ENDPOINT:http://${MINIO_PUBLIC_HOST:localhost}:${MINIO_PUBLIC_PORT:9000}}
  access-key: ${MINIO_ACCESS_KEY:SPRING_BOOT_USER}
  secret-key: ${MINIO_SECRET_KEY:SuperSecretKey123}
  webhook:
    authorization: ${MINIO_WEBHOOK_AUTHORIZATION:Bearer dev-minio-webhook-token}
  buckets:
    raw-videos: raw-videos
    tracking-data: tracking-data
    clips: clips
    hls-streams: hls-streams
    field-detection: field-detection

idp:
  provider: keycloak
  keycloak:
    server-url: http://${KEYCLOAK_HOST:localhost}:${KEYCLOAK_PORT:9080}
    realm: "football-realm"
    client-id: "football-web-client"
    principal-attribute: "sub"
    admin-client:
      id: "football-admin-client"
      secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:M4Yl0gIvqOL02OSfB6eHgkM9NNersMHH}
  route-permissions: # Itt meg tudod adni a role-okat, amik az egyes endpointokhoz kellenek
        # Team Invites
    - path: /api/team-invites/*
      method: GET
      roles: []
    - path: /api/me/views
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/me/children
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/player-profiles/*/child-login-invites
      method: POST
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/player-profiles/*/child-login
      method: POST
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/player-profiles/*/parent-invites
      method: POST
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/player-profiles/*/parent-invites
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/player-profiles/*/parent-invites/*
      method: DELETE
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/player-profiles/*/child-login
      method: DELETE
      roles: [admin, club_admin]
    - path: /api/player-profiles/*/ride-offer-right
      method: PUT
      roles: [parent]
    - path: /api/player-profiles/*/parents
      method: GET
      roles: [admin, club_admin]
    - path: /api/player-profiles/*/parents/*
      method: DELETE
      roles: [admin, club_admin]
    - path: /api/team-invites/*/invites
      roles: [admin, club_admin, coach, player, parent]
    - path: /api/team-invites/*/accept
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/team-invites/*
      roles: [admin, coach, player, parent, fan]
      
    # Travel. Longer paths first. Fans are not on these routes.
    # Seat booking is admin, club admin, player, and parent (same rule as canActForProfile). Coach is not.
    # A coach cannot change a child's attendance. Club admin and admin still can.
    - path: /api/teams/*/events/*/rides/*/seats/*
      method: DELETE
      roles: [admin, club_admin, player, parent]
    - path: /api/teams/*/events/*/rides/*/seats
      method: POST
      roles: [admin, club_admin, player, parent]
    - path: /api/teams/*/events/*/rides/*
      method: PUT
      roles: [club_admin, coach, parent, player]
    - path: /api/teams/*/events/*/rides/*
      method: DELETE
      roles: [club_admin, coach, parent, player]
    - path: /api/teams/*/events/*/rides
      method: POST
      roles: [club_admin, coach, parent, player]
    - path: /api/teams/*/events/*/attendance/*
      method: PUT
      roles: [admin, club_admin, player, parent]
    - path: /api/teams/*/events/*
      method: GET
      roles: [admin, club_admin, coach, player, parent]
    - path: /api/teams/*/events/*
      method: PUT
      roles: [admin, club_admin, coach]
    - path: /api/teams/*/events/*
      method: DELETE
      roles: [admin, club_admin, coach]
    - path: /api/teams/*/events
      method: GET
      roles: [admin, club_admin, coach, player, parent]
    - path: /api/teams/*/events
      method: POST
      roles: [admin, club_admin, coach]

    # Teams Endpoint - Read operations
    - path: /api/teams
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/teams/me
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/teams/*
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]

    # Team creation: platform admin globally; club admin only through its club.
    # Other team writes have their own membership checks below.
    - path: /api/teams
      method: POST
      roles: [admin, club_admin]
    - path: /api/teams/*
      method: PUT
      roles: [admin, club_admin, coach]
    - path: /api/teams/*
      method: DELETE
      roles: [admin, club_admin, coach]

    # Coaches manage their own team through invites. A login-less roster row
    # or an existing player account is attached by an admin or a club admin.
    - path: /api/teams/*/player-profiles
      method: POST
      roles: [admin, club_admin]
    - path: /api/teams/*/players/*
      method: POST
      roles: [admin, club_admin]
    - path: /api/teams/*/players/*
      method: DELETE
      roles: [admin, club_admin, coach]
    - path: /api/teams/*/coaches/*
      roles: [admin, club_admin]
    - path: /api/teams/*/fans/*
      roles: [admin, club_admin]
    - path: /api/teams/*/parents/*
      method: DELETE
      roles: [admin, club_admin]

    - path: /api/clubs
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/clubs/*/users
      method: GET
      roles: [admin, club_admin]
    - path: /api/clubs/*/admins
      method: GET
      roles: [admin, club_admin]
    - path: /api/clubs/*/admins/*
      method: DELETE
      roles: [admin, club_admin]
    - path: /api/clubs/*/admin-invites
      method: POST
      roles: [admin, club_admin]
    - path: /api/clubs/*/teams
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/clubs/*/teams
      method: POST
      roles: [admin, club_admin]
    - path: /api/clubs/*
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/clubs
      method: POST
      roles: [admin]
    - path: /api/clubs/*
      method: PUT
      roles: [admin, club_admin]
    - path: /api/clubs/*
      method: DELETE
      roles: [admin, club_admin]

    # Matches Endpoint - Read operations
    - path: /api/matches
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/matches/*/clips
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/matches/*
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]

    # Matches Endpoint - Write operations
    - path: /api/matches/upload
      method: POST
      roles: [admin, coach]
    - path: /api/matches/*/confirm-corners
      method: POST
      roles: [admin, coach]
    - path: /api/matches/*
      method: PUT
      roles: [admin, coach]
    - path: /api/matches/*/tracking/label-data
      method: PUT
      roles: [admin, coach]
    - path: /api/matches/*
      method: DELETE
      roles: [admin, coach]


    # Clips - Read operations
    - path: /api/clips/*
      method: GET
      roles: [admin, club_admin, coach, player, parent]
    - path: /api/clips/*/access
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]

    # Clips - Create operations (matchId must be included in request body)
    - path: /api/clips
      method: POST
      roles: [admin, coach]
    - path: /api/clips/upload-links
      method: POST
      roles: [admin, coach]

    # Clips Composition Complete
    - path: /api/clips/*/composition/complete
      method: POST
      roles: [admin, coach]

    # Clips - Update/Delete operations
    - path: /api/clips/*
      method: PUT
      roles: [admin, coach]
    - path: /api/clips/*
      method: DELETE
      roles: [admin, coach]

    # Team Chat Endpoint
    - path: /api/teams/*/chat
      method: POST
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/teams/*/chat
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/teams/*/chat/subscribe
      method: GET
      roles: [admin, club_admin, coach, player, parent, fan]

    # User Endpoint - Read operations
    - path: /api/users
      method: GET
      roles: [admin]
    - path: /api/users/*
      method: GET
      roles: [admin]

    # User Endpoint - Create operations
    - path: /api/users
      method: POST
      roles: [admin]
    - path: /api/users/register
      method: POST
      roles: []

    # User Endpoint - Update operations
    # A club admin may rename a user who belongs to their club. The service
    # rejects every other account, including platform admins.
    - path: /api/users/me
      method: PUT
      roles: [admin, club_admin, coach, player, parent, fan]
    - path: /api/users/*
      method: PUT
      roles: [admin, club_admin]

    # User Endpoint - Delete operations
    - path: /api/users/*
      method: DELETE
      roles: [admin]

    # Cup
    - path: /api/cups
      method: POST
      roles: [admin, coach]
    - path: /api/cups/
      method: GET
      roles: [admin, coach, player, parent, fan]
    - path: /api/cups/*
      method: GET
      roles: [admin, coach, player, parent, fan]
    - path: /api/cups/*/teams
      method: GET
      roles: [admin, coach, player, parent, fan]
    - path: /api/cups/*/teams
      method: POST
      roles: [admin, coach]
    - path: /api/cups/*/teams/*
      method: PUT
      roles: [admin, coach]
    - path: /api/cups/*/teams/*
      method: DELETE
      roles: [admin, coach]
    - path: /api/cups/*/matches
      method: POST
      roles: [admin, coach]
    - path: /api/cups/*/matches/*
      method: PUT
      roles: [admin, coach]
    - path: /api/cups/*/matches/*
      method: DELETE
      roles: [admin, coach]
    - path: /api/cups/*/matches/*/score
      method: PUT
      roles: [admin, coach]
    - path: /api/cups/*/matches/*/real-match
      method: PUT
      roles: [admin, coach]
    - path: /api/cups/*/matches/*/real-match
      method: DELETE
      roles: [admin, coach]
    - path: /api/cups/*/standings
      method: GET
      roles: [admin, coach, player, parent, fan]

    # Others
    - path: /api/notifications/subscribe/*
      roles: [admin, coach, player, parent, fan]
    - path: /api/webhooks/minio
      roles: []

react-app:
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173,http://localhost:4173}


# ==========================================
# ALAPBEÁLLÍTÁSOK (Minden környezetben él)
# ==========================================

logging:
  file:
    name: ${LOG_FILE_NAME:./logs/football-analysis.jsonl}

  group:
    app: com.example.footballanalysis
    web: org.springframework.web,org.springframework.security
    db: org.hibernate.SQL,org.hibernate.orm.jdbc.bind,org.springframework.transaction

  structured:
    format:
      # CSAK a fájlba kérjük alapértelmezetten a JSON-t (logstash)!
      # A konzol beállítást itt nem piszkáljuk.
      file: logstash
    json:
      add:
        application: ${spring.application.name}
        profile: ${spring.profiles.active:default}

  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_NAME:./logs/football-analysis}.%d{yyyy-MM-dd}.%i.jsonl.gz
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: false
---
# ==========================================
# FEJLESZTŐI KÖRNYEZET (LOKÁLIS GÉP - DEV)
# ==========================================
spring:
  config:
    activate:
      on-profile: "default, dev" # Ha nincs profil megadva, ez él

logging:
  # Itt NINCS structured.format.console beállítás, 
  # így a konzolon marad a gyönyörű, színes Spring Boot default szöveg!
  level:
    root: WARN
    app: INFO
    web: WARN
    db: WARN
    org.hibernate.SQL: OFF
#    root: INFO
#    app: DEBUG
#    web: INFO
#    db: DEBUG
#    org.hibernate.SQL: DEBUG

---
# ==========================================
# ÉLES KÖRNYEZET (PROD)
# ==========================================
spring:
  config:
    activate:
      on-profile: "prod"
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  structured:
    format:
      # Élesben viszont a konzolra IS JSON-t küldünk (Docker/Kubernetes miatt)
      console: logstash 
  level:
    root: WARN
    app: INFO
    web: WARN
    db: WARN
    org.hibernate.SQL: OFF
