server:
  port: 8080 # The port React and MinIO will call

spring:
  application:
    name: football-analysis

  # 1. PostgreSQL Connection
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/football_db}
    username: ${SPRING_DATASOURCE_USERNAME:admin}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: "${idp.keycloak.server-url}/realms/football-realm"
          jwk-set-uri: "${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs"


  # Hibernate/JPA Configuration
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update # Automatically creates/updates your DB tables based on Java classes
    show-sql: false # Structured SQL logging is configured below so output stays valid JSON
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 50

  # 2. RabbitMQ Connection
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: 5672
    username: admin
    password: password

# 3. Custom MinIO Configuration
# We create our own namespace here, which we will read into Java later
minio:
  endpoint: http://${MINIO_HOST:localhost}:9000
  access-key: SPRING_BOOT_USER
  secret-key: SuperSecretKey123 # TODO security: move to env var, ${MINIO_SECRET_KEY}
  buckets:
    raw-videos: raw-videos
    tracking-data: tracking-data
    clips: clips

idp:
  provider: keycloak
  keycloak:
    server-url: http://${KEYCLOAK_HOST:localhost}:9080
    realm: "football-realm"
    client-id: "football-web-client"
    principal-attribute: "sub"
    admin-client:
      id: "football-admin-client"
      secret: "M4Yl0gIvqOL02OSfB6eHgkM9NNersMHH" # TODO security: move to env var, ${KEYCLOAK_ADMIN_CLIENT_SECRET}
  route-permissions: # Itt meg tudod adni a role-okat, amik az egyes endpointokhoz kellenek
    # Team Invites
    - path: /api/team-invites/*/invites
      roles: [admin, coach, player]
    - path: /api/team-invites/*/accept
      roles: [admin, coach, player, fan]
    - path: /api/team-invites/*
      roles: [admin, coach, player, fan]
      
    # Teams Endpoint - Read operations
    - path: /api/teams
      roles: [admin]
    - path: /api/teams/me
      roles: [admin, coach, player, fan]

    # Teams Endpoint - Write operations
    - path: /api/teams/*
      roles: [admin, coach]

    # Team Members (Players, Coaches, Fans)
    - path: /api/teams/*/players/*
      roles: [admin]
    - path: /api/teams/*/coaches/*
      roles: [admin]
    - path: /api/teams/*/fans/*
      roles: [admin]

    # Matches Endpoint
    - path: /api/matches/upload
      roles: [admin, coach]
    - path: /api/matches/*/clips/upload
      roles: [admin, coach]
    - path: /api/matches/*/clips
      roles: [admin, coach]
    - path: /api/matches/*/clips/*
      roles: [admin, coach, player, fan]
    - path: /api/matches
      roles: [admin, coach]
    - path: /api/matches/*
      roles: [admin, coach]

    # User Endpoint
    - path: /api/users/register
      roles: []
    - path: /api/users/me
      roles: [admin, coach, player, fan]
    - path: /api/users
      roles: [admin]
    - path: /api/users/*
      roles: [admin]

    # Others
    - path: /api/notifications/subscribe/*
      roles: [admin, coach, player, fan]
    - path: /api/webhooks/minio
      roles: []

# ==========================================
# ALAPBEÁLLÍTÁSOK (Minden környezetben él)
# ==========================================

logging:
  file:
    name: ${LOG_FILE_NAME:./logs/football-analysis.jsonl}
  
  group:
    app: com.example.footballanalysis
    web: org.springframework.web,org.springframework.security
    db: org.hibernate.SQL,org.hibernate.orm.jdbc.bind,org.springframework.transaction
  
  structured:
    format:
      # CSAK a fájlba kérjük alapértelmezetten a JSON-t (logstash)! 
      # A konzol beállítást itt nem piszkáljuk.
      file: logstash 
    json:
      add:
        application: ${spring.application.name}
        profile: ${spring.profiles.active:default}
  
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_FILE_NAME:./logs/football-analysis}.%d{yyyy-MM-dd}.%i.jsonl.gz
      max-file-size: 50MB
      max-history: 14
      total-size-cap: 1GB
      clean-history-on-start: false

---
# ==========================================
# FEJLESZTŐI KÖRNYEZET (LOKÁLIS GÉP - DEV)
# ==========================================
spring:
  config:
    activate:
      on-profile: "default, dev" # Ha nincs profil megadva, ez él

logging:
  # Itt NINCS structured.format.console beállítás, 
  # így a konzolon marad a gyönyörű, színes Spring Boot default szöveg!
  level:
    root: WARN
    app: INFO
    web: WARN
    db: WARN
    org.hibernate.SQL: OFF
#    root: INFO
#    app: DEBUG
#    web: INFO
#    db: DEBUG
#    org.hibernate.SQL: DEBUG

---
# ==========================================
# ÉLES KÖRNYEZET (PROD)
# ==========================================
spring:
  config:
    activate:
      on-profile: "prod"

logging:
  structured:
    format:
      # Élesben viszont a konzolra IS JSON-t küldünk (Docker/Kubernetes miatt)
      console: logstash 
  level:
    root: WARN
    app: INFO
    web: WARN
    db: WARN
    org.hibernate.SQL: OFF