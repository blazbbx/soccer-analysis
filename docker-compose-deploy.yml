services:
  frontend:
    build:
      context: ./frontend
    container_name: football-frontend
    restart: always
    ports:
      - "8085:80"
    networks: [app-net]

  postgres:
    image: postgres:15-alpine
    container_name: football-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: football_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d football_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-setup:
    image: postgres:15-alpine
    container_name: football-postgres-setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-setup.sh:/setup.sh
    command: sh -c "/setup.sh"
    networks: [app-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: football-keycloak
    restart: always
    command:
      - start
      - --import-realm
      - --hostname=http://localhost:9085
      - --http-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    ports:
      - "9085:8080"
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app-net]

  minio:
    image: minio/minio:latest
    container_name: football-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://localhost:8085"
      MINIO_NOTIFY_WEBHOOK_ENABLE_spring: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_spring: "http://football-analysis:8080/api/webhooks/minio"
      MINIO_SERVER_URL: http://localhost:9015
    ports:
      - "9015:9000"
      - "9016:9001"
    volumes:
      - minio_data:/data
    networks: [app-net]

  minio-setup:
    image: minio/mc:latest
    container_name: football-minio-setup
    depends_on:
      - minio
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - ./minio-setup.sh:/setup.sh
    entrypoint: /bin/sh
    command: -c "/setup.sh"
    networks: [app-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: football-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [app-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  encoder-worker:
    build:
      context: ./python/encoder
    container_name: football-encoder-worker
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=${RABBITMQ_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_PUBLIC_SCHEME=http
      - MINIO_PUBLIC_HOST=localhost
      - MINIO_PUBLIC_PORT=9015
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    networks: [app-net]

  clip-render-worker:
    build:
      context: ./python/clip_renderer
    container_name: football-clip-render-worker
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=${RABBITMQ_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    networks: [app-net]

  field-detection-worker:
    build:
      context: ./python/ml
    container_name: football-field-detection-worker
    command: uv run python field_detection/field_detection_pipeline.py
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=${RABBITMQ_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_PUBLIC_SCHEME=http
      - MINIO_PUBLIC_HOST=localhost
      - MINIO_PUBLIC_PORT=9015
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    networks: [app-net]

  object-detection-worker:
    build:
      context: ./python/ml
      dockerfile: Dockerfile.gpu
    container_name: football-object-detection-worker
    command: uv run python object_detection/object_detection_pipeline.py
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASS=${RABBITMQ_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_PUBLIC_SCHEME=http
      - MINIO_PUBLIC_HOST=localhost
      - MINIO_PUBLIC_PORT=9015
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY}
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [app-net]

  football-analysis:
    build:
      context: ./backend/football-analysis
      dockerfile: Dockerfile
    container_name: football-analysis
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/football_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_HOST: minio
      MINIO_PUBLIC_ENDPOINT: http://localhost:9015
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      FRONTEND_URL: http://localhost:8085, http://127.0.0.1:8085
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_PORT: 8080
      KEYCLOAK_ISSUER_URI: http://localhost:9085/realms/football-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/football-realm/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started
    networks: [app-net]

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data: