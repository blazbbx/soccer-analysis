services:
  frontend:
    build:
      context: ./frontend
      args:
        # Host ports this file publishes for Spring and Keycloak. The SPA takes the
        # host from window.location at runtime and only the ports at build time.
        VITE_API_PORT: "8086"
        VITE_KEYCLOAK_PORT: "9085"
    container_name: football-frontend
    restart: always
    ports:
      - "8085:80"
    networks: [app-net]

  postgres:
    image: postgres:15-alpine
    container_name: football-postgres
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: football_db
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [app-net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d football_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  postgres-setup:
    image: postgres:15-alpine
    container_name: football-postgres-setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./postgres-setup.sh:/setup.sh
    command: sh -c "/setup.sh"
    networks: [app-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.5.2
    container_name: football-keycloak
    restart: always
    command:
      - start
      - --import-realm
      - --hostname=http://${SERVER_HOST:-localhost}:9085
      - --http-enabled=true
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak_db
      KC_DB_USERNAME: admin
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      # The realm import reads these two: the web client's redirect URIs and web origins,
      # and the secret of football-admin-client (the same value Spring gets below).
      SERVER_HOST: ${SERVER_HOST:-localhost}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
    ports:
      - "9085:8080"
    volumes:
      - ./keycloak-config:/opt/keycloak/data/import
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app-net]

  minio:
    image: minio/minio:latest
    container_name: football-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: "http://${SERVER_HOST:-localhost}:8085"
      MINIO_NOTIFY_WEBHOOK_ENABLE_spring: "on"
      MINIO_NOTIFY_WEBHOOK_ENDPOINT_spring: "http://football-analysis:8080/api/webhooks/minio"
      MINIO_NOTIFY_WEBHOOK_AUTH_TOKEN_spring: "Bearer ${MINIO_WEBHOOK_TOKEN:?Set MINIO_WEBHOOK_TOKEN in .env}"
      MINIO_SERVER_URL: http://${SERVER_HOST:-localhost}:9015
      # Static KMS key for SSE-S3 of medical-docs, from .env only. Back it up: without it the files cannot be read.
      MINIO_KMS_SECRET_KEY: ${MINIO_KMS_SECRET_KEY:?Set MINIO_KMS_SECRET_KEY in .env, format name:base64 of 32 random bytes}
    ports:
      - "9015:9000"
      # The MinIO console holds the root login: reachable only from the server itself (or an SSH tunnel).
      - "127.0.0.1:9016:9001"
    volumes:
      - minio_data:/data
    networks: [app-net]

  minio-setup:
    image: minio/mc:latest
    container_name: football-minio-setup
    depends_on:
      - minio
    environment:
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      # The script exits when either is empty.
      MINIO_APP_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_APP_SECRET_KEY: ${MINIO_SECRET_KEY}
      # Second account for the four Python workers, without the medical and club document buckets.
      MINIO_WORKER_ACCESS_KEY: ${MINIO_WORKER_ACCESS_KEY}
      MINIO_WORKER_SECRET_KEY: ${MINIO_WORKER_SECRET_KEY}
    volumes:
      - ./minio-setup.sh:/setup.sh
    entrypoint: /bin/sh
    command: -c "/setup.sh"
    networks: [app-net]

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: football-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
    expose:
      - "5672"
      - "15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks: [app-net]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  encoder-worker:
    build:
      context: ./python/encoder
    container_name: football-encoder-worker
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_PUBLIC_SCHEME=http
      - MINIO_PUBLIC_HOST=${SERVER_HOST:-localhost}
      - MINIO_PUBLIC_PORT=9015
      - MINIO_ACCESS_KEY=${MINIO_WORKER_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_WORKER_SECRET_KEY}
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    networks: [app-net]

  clip-render-worker:
    build:
      context: ./python/clip_renderer
    container_name: football-clip-render-worker
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_ACCESS_KEY=${MINIO_WORKER_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_WORKER_SECRET_KEY}
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    networks: [app-net]

  field-detection-worker:
    build:
      context: ./python/ml
    container_name: football-field-detection-worker
    command: uv run python field_detection/field_detection_pipeline.py
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_PUBLIC_SCHEME=http
      - MINIO_PUBLIC_HOST=${SERVER_HOST:-localhost}
      - MINIO_PUBLIC_PORT=9015
      - MINIO_ACCESS_KEY=${MINIO_WORKER_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_WORKER_SECRET_KEY}
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    networks: [app-net]

  object-detection-worker:
    build:
      context: ./python/ml
      dockerfile: Dockerfile.gpu
    container_name: football-object-detection-worker
    command: uv run python object_detection/object_detection_pipeline.py
    restart: always
    environment:
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_USER=admin
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - MINIO_HOST=minio
      - MINIO_PUBLIC_SCHEME=http
      - MINIO_PUBLIC_HOST=${SERVER_HOST:-localhost}
      - MINIO_PUBLIC_PORT=9015
      - MINIO_ACCESS_KEY=${MINIO_WORKER_ACCESS_KEY}
      - MINIO_SECRET_KEY=${MINIO_WORKER_SECRET_KEY}
    depends_on:
      rabbitmq:
        condition: service_started
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks: [app-net]

  football-analysis:
    build:
      context: ./backend/football-analysis
      dockerfile: Dockerfile
    container_name: football-analysis
    restart: always
    environment:
      # Turns Swagger off and switches the console log to JSON; the admin client secret has no default here.
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/football_db
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: admin
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MINIO_HOST: minio
      MINIO_PUBLIC_ENDPOINT: http://${SERVER_HOST:-localhost}:9015
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      FRONTEND_URL: http://${SERVER_HOST:-localhost}:8085
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_PORT: 8080
      KEYCLOAK_ISSUER_URI: http://${SERVER_HOST:-localhost}:9085/realms/football-realm
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/football-realm/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?Set KEYCLOAK_ADMIN_CLIENT_SECRET in .env}
      MINIO_WEBHOOK_AUTHORIZATION: "Bearer ${MINIO_WEBHOOK_TOKEN:?Set MINIO_WEBHOOK_TOKEN in .env}"
      # First platform admin, created on startup when both are set and no admin exists yet.
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}
      # Event and chat times are local (Europe/Budapest); keep the JVM, JDBC and app clock on the same zone.
      TZ: Europe/Budapest
      APP_TIME_ZONE: Europe/Budapest
      JAVA_TOOL_OPTIONS: -Duser.timezone=Europe/Budapest
      # New medical files need an https MINIO_PUBLIC_ENDPOINT and a non-dev secret. Override only in .env,
      # knowingly, for a local demo.
      MEDICAL_STRICT_STORAGE: ${MEDICAL_STRICT_STORAGE:-true}
      # Empty until the approved data processing agreement and notice template exist (docs/sportorvosi-jogszeruseg.md, J4, J5).
      MEDICAL_DPA_VERSION: ${MEDICAL_DPA_VERSION:-}
      MEDICAL_DPA_DOCUMENT_URL: ${MEDICAL_DPA_DOCUMENT_URL:-}
      MEDICAL_NOTICE_TEMPLATE_URL: ${MEDICAL_NOTICE_TEMPLATE_URL:-}
    ports:
      - "8086:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
      minio:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    networks: [app-net]

networks:
  app-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
  rabbitmq_data: