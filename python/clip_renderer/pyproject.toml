[project]
name = "clip-renderer"
version = "0.1.0"
description = "Clip render worker — composites overlay + audio onto an aligned base video, re-rendering the playback timeline (PLAY/SEEK/PAUSE) the coach recorded."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.9",
    "botocore>=1.43.9",
    "pika>=1.4.0",
]
