[project]
name = "encoder"
version = "0.1.0"
description = "HLS encoder worker — consumes video-encoding-queue, transcodes via ffmpeg, uploads HLS playlist + segments to MinIO."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.9",
    "botocore>=1.43.9",
    "ffmpeg-python>=0.2.0",
    "pika>=1.4.0",
]
