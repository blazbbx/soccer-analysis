# GPU overlay — combines with docker-compose.yml.
#
# Usage from the repo root (no --build: reuse the existing worker image):
#   docker compose -f docker-compose.yml -f docker-compose-gpu.yml up -d object-detection-worker
#
# The current python/ml image already ships CUDA torch wheels. This overlay
# only attaches the host GPU to that container. Do NOT pass --build unless
# you intentionally want to rebuild (that takes a long time).
#
# Requires NVIDIA driver + Docker Desktop GPU/WSL2. Field-detection stays
# on CPU (one frame per match).

services:
  object-detection-worker:
    gpus: all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
